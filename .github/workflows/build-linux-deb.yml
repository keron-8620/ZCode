name: Build ZCode AppImage
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup pnpm (auto detect version from package.json)
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install system build dependencies
        run: |
          sudo apt update
          sudo apt install -y fakeroot libarchive-tools build-essential

      - name: Install project dependencies
        run: pnpm install

      - name: Build desktop AppImage
        run: pnpm bundle:desktop -- --os linux --arch x64

      - name: Find AppImage path
        id: find_appimage
        run: |
          APPIMAGE=$(find . -name "ZCode-*.AppImage" | head -1)
          echo "APPIMAGE=$APPIMAGE" >> $GITHUB_ENV
          echo "APPIMAGE_NAME=$(basename $APPIMAGE)" >> $GITHUB_ENV

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZCode-Linux-x64-AppImage
          path: |
            ${{ env.APPIMAGE }}
            !node_modules/**
